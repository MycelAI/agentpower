<title id="t">Agentpower (AP)</title>
<desc id="d">A unit of cognitive work output for the AI age. Specification 2.0. A curve rises with AI speed-up and flattens below a ceiling, the Amdahl limit on agentpower.</desc>
<rect width="960" height="220" rx="18" fill="#0b1220"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
