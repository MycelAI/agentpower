[project]
name = "agentpower"
version = "2.0.0"
description = "Reference estimators and Monte Carlo simulation for the Agentpower (AP) framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CODE", "LICENSES/*.txt"]
authors = [{ name = "Alphin Tom", email = "dev@mycel-ai.de" }]
keywords = ["agentpower", "AI productivity", "knowledge work", "measurement", "monte carlo"]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
agentpower = "agentpower.cli:main"

[project.urls]
Homepage = "https://mycel-ai.de/agentpower"
Repository = "https://github.com/MycelAI/agentpower"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
